name: Notify Docs
on:
  workflow_call: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: ARTTU-Software/documentation
          event-type: docs-release
          client-payload: |
            {
              "repo": "${{ github.event.repository.name }}",
              "tag": "${{ github.ref_name }}"
            }