name: Sync Agent Guidelines & Skills

on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.agents/**'
      - '.github/sync.yml'
      - '.github/workflows/sync-agent-rules.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve PAT & Configure Git
        id: auth
        run: |
          TOKEN="${{ secrets.SYNC_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.DOCS_DISPATCH_TOKEN }}"
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://${TOKEN}@github.com/"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://oauth:${TOKEN}@github.com/"

      - name: Run GitHub File Sync
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.auth.outputs.token }}
          CONFIG_PATH: .github/sync.yml
          PR_LABELS: |
            automation
            agent-rules
          COMMIT_PREFIX: "chore(agents): "
