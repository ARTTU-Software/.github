name: Sync Agent Guidelines & Skills

on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.agents/**'
      - '.cursor/**'
      - '.claude/**'
      - '.codex/**'
      - '.mcp.json'
      - 'docs/agent-harness.md'
      - '.github/workflows/agent-harness-check.yml'
      - 'PULL_REQUEST_TEMPLATE.md'
      - '.github/sync.yml'
      - '.github/workflows/sync-agent-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate downstream payload
        run: |
          python .agents/hooks/sync_plan.py check
          python .agents/hooks/doctor.py --self-test
      - name: Read targets from sync.yml
        id: targets
        run: echo "matrix=$(python .agents/hooks/sync_plan.py matrix)" >> "$GITHUB_OUTPUT"

  sync:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout .github repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-contents: write
          permission-pull-requests: write
          # Required because the payload includes .github/workflows/agent-harness-check.yml.
          # Enable Workflows read/write on arttu-sync-bot and approve it on the installation.
          permission-workflows: write

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Prepare Single-Repo Sync Config
        env:
          SYNC_TARGET: ${{ matrix.target }}
        run: |
          python .agents/hooks/sync_plan.py render --target "$SYNC_TARGET" --output .github/sync-matrix.yml

      - name: Run GitHub File Sync
        id: sync
        uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app_token.outputs.token }}
          CONFIG_PATH: .github/sync-matrix.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: |
            automation
            agent-rules
          COMMIT_PREFIX: "chore(agents): "

      - name: Convert PR to Draft
        if: steps.sync.outputs.pull_request_urls != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SYNC_PR_URLS: ${{ steps.sync.outputs.pull_request_urls }}
        run: |
          printf '%s\n' "$SYNC_PR_URLS" | jq -r '.[]?' | while read -r url; do
            if [ -n "$url" ]; then
              echo "Ensuring draft status for $url..."
              gh pr ready "$url" --undo || echo "PR $url could not be converted or is already draft"
            fi
          done
