name: Sync Agent Guidelines & Skills

on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.agents/**'
      - '.github/sync.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4

      - name: Run GitHub File Sync
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN || secrets.DOCS_DISPATCH_TOKEN }}
          CONFIG_PATH: .github/sync.yml
          PR_LABELS: |
            automation
            agent-rules
          COMMIT_PREFIX: "chore(agents): "
