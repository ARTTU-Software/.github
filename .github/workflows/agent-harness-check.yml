name: Agent Harness Checks

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      base_revision:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  harness:
    name: Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Setup and regression checks
        run: python .agents/hooks/doctor.py --self-test
      - name: Independent source policy gate
        shell: pwsh
        env:
          ARTTU_BASE: ${{ inputs.base_revision || github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if ($env:ARTTU_BASE -match '^0+$') { $env:ARTTU_BASE = 'EMPTY' }
          python .agents/hooks/verify_changes.py --base $env:ARTTU_BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
