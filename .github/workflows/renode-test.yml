name: Central Renode Robot Tests

on:
  workflow_call:
    inputs:
      enabled:
        description: 'Run Renode and publish results; false skips both jobs'
        type: boolean
        default: true
      runner:
        description: 'JSON runs-on value: labels array or group/labels object'
        type: string
        default: '["renode"]'
      python-version:
        description: 'Optional setup-python version; empty reuses the installed interpreter'
        type: string
        default: ''
      renode-url:
        description: 'Optional Linux x64 portable .NET tar.gz; empty uses installed Renode'
        type: string
        default: ''
      renode-sha256:
        description: 'SHA-256 of that archive, validated by the adopting board'
        type: string
        default: ''
      renode-path:
        description: 'Installed executable path; empty discovers renode on PATH'
        type: string
        default: ''
      renode-tests:
        description: 'Optional installed directory containing run_tests.py'
        type: string
        default: ''
      arm-gdb:
        description: 'Optional ARM-capable GDB path for board source-debugging tests'
        type: string
        default: ''
      setup-command:
        description: 'Board toolchain/dependency setup (bash, before build)'
        type: string
        default: ''
      build-command:
        description: 'Build the board test ELFs; use python --version for the infrastructure smoke only'
        required: true
        type: string
      test-command:
        description: 'Board runner; must honor RENODE, RENODE_JOBS and RENODE_RESULTS_DIR'
        type: string
        default: 'python test/renode/harness/run_tests.py'
      requirements:
        type: string
        default: 'test/renode/harness/requirements.txt'
      jobs:
        description: 'Independent suite workers; benchmark before increasing'
        type: number
        default: 1
      timeout-minutes:
        type: number
        default: 30
      artifact-name:
        description: 'Use distinct names for callers running a matrix'
        type: string
        default: 'renode-results'

permissions:
  contents: read

jobs:
  renode:
    if: inputs.enabled
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RENODE_JOBS: ${{ inputs.jobs }}
      RENODE_RESULTS_DIR: ${{ github.workspace }}/build/renode/results
      RENODE: ${{ inputs.renode-path }}
      RENODE_TESTS: ${{ inputs.renode-tests }}
      ARM_GDB: ${{ inputs.arm-gdb }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
      - name: Create isolated Python environment
        run: |
          [[ "$RUNNER_OS" == Linux ]]
          venv_dir="$RUNNER_TEMP/renode-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python_bin="$(command -v python || command -v python3)"
          "$python_bin" -m venv --without-pip "$venv_dir"
          echo "RENODE_BOOTSTRAP_PYTHON=$python_bin" >> "$GITHUB_ENV"
          echo "RENODE_PYTHON_ENV=$venv_dir" >> "$GITHUB_ENV"
          echo "$venv_dir/bin" >> "$GITHUB_PATH"
      - name: Install pinned Renode archive
        if: inputs.renode-url != ''
        env:
          RENODE_URL: ${{ inputs.renode-url }}
          RENODE_SHA256: ${{ inputs.renode-sha256 }}
        run: |
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$RENODE_URL" == https://* ]]
          [[ "$RENODE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          archive="$RUNNER_TEMP/renode.tar.gz"
          install_dir="$RUNNER_TEMP/renode"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "$RENODE_URL" -o "$archive"
          printf '%s  %s\n' "$RENODE_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/renode"
          test -f "$install_dir/tests/run_tests.py"
          echo "RENODE=$install_dir/renode" >> "$GITHUB_ENV"
          echo "RENODE_TESTS=$install_dir/tests" >> "$GITHUB_ENV"
          "$install_dir/renode" --version
      - name: Check installed Renode
        if: inputs.renode-url == ''
        run: |
          if [[ -z "$RENODE" ]]; then RENODE="$(command -v renode)"; fi
          test -f "$RENODE"
          echo "RENODE=$RENODE" >> "$GITHUB_ENV"
          if [[ -z "$RENODE_TESTS" ]]; then
            for tests_dir in "$(dirname "$RENODE")/tests" /opt/renode/tests /usr/share/renode/tests; do
              if [[ -f "$tests_dir/run_tests.py" ]]; then RENODE_TESTS="$tests_dir"; break; fi
            done
          fi
          test -f "$RENODE_TESTS/run_tests.py"
          echo "RENODE_TESTS=$RENODE_TESTS" >> "$GITHUB_ENV"
          "$RENODE" --version
          # Debian's shell launcher does not exec: the native runner needs the
          # actual .NET process PID for robot_port discovery. Also supports
          # existing board adapters that take RENODE directly as the server.
          if [[ "$RENODE" == /usr/bin/renode && -f "$RENODE_TESTS/../bin/Renode.dll" ]]; then
            echo "RENODE=$RENODE_TESTS/../bin/Renode.dll" >> "$GITHUB_ENV"
          fi
      - name: Install Robot dependencies
        env:
          ROBOT_REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          req="$ROBOT_REQUIREMENTS"
          if [[ ! -f "$req" && -f "test/renode/requirements.txt" ]]; then
            req="test/renode/requirements.txt"
          fi
          if [[ -f "$req" ]]; then
            "$RENODE_BOOTSTRAP_PYTHON" -m pip --python "$RENODE_PYTHON_ENV" install --disable-pip-version-check pip -r "$req"
          fi
      - name: Board dependency setup
        env:
          BOARD_SETUP: ${{ inputs.setup-command }}
        run: |
          if [[ -n "$BOARD_SETUP" ]]; then bash -e -o pipefail -c "$BOARD_SETUP"; fi
      - name: Build test firmware
        env:
          BOARD_BUILD: ${{ inputs.build-command }}
        run: bash -e -o pipefail -c "$BOARD_BUILD"
      - name: Run Renode regression suite
        env:
          BOARD_TEST: ${{ inputs.test-command }}
        run: |
          cmd="$BOARD_TEST"
          if [[ "$cmd" == "python test/renode/harness/run_tests.py" && ! -f "test/renode/harness/run_tests.py" && -f "test/renode/run_tests.py" ]]; then
            cmd="python test/renode/run_tests.py"
          fi
          bash -e -o pipefail -c "$cmd"
      - name: Preserve reports and failure evidence
        id: reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build/renode/results/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish Renode test results
    needs: renode
    if: always() && inputs.enabled && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      # Reporting runs separately so the workshop runner does not need Docker
      # or a token with permission to publish checks and PR comments.
      - name: Download test reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: ${{ inputs.artifact-name }}
          path: renode-results
      - name: Publish xUnit checks, PR comment and job summary
        if: hashFiles('renode-results/xunit.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          files: renode-results/xunit.xml
          check_name: Renode (${{ inputs.artifact-name }})
          comment_title: Renode (${{ inputs.artifact-name }})
          comment_mode: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'off' }}
          check_run: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          job_summary: true
          action_fail: false
      - name: Report infrastructure status and link artifacts
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RENODE_JOB_RESULT: ${{ needs.renode.result }}
          RENODE_ARTIFACT: ${{ inputs.artifact-name }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const reportExists = fs.existsSync('renode-results/xunit.xml');
            const name = `Renode (${process.env.RENODE_ARTIFACT})`;
            const message = reportExists
              ? `Execution job: **${process.env.RENODE_JOB_RESULT}**. Download **${process.env.RENODE_ARTIFACT}** from the [workflow run](${runUrl}) for Robot HTML reports, logs and evidence.`
              : `Execution job: **${process.env.RENODE_JOB_RESULT}**. No xUnit report was produced. Check setup/build/runner errors in the [workflow run](${runUrl}).`;
            await core.summary.addHeading(name).addRaw(message).write();
            const writable = context.eventName !== 'pull_request' || context.payload.pull_request.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (writable) {
              await github.rest.checks.create({
                ...context.repo, name: `${name}: execution`, head_sha: context.sha, status: 'completed',
                conclusion: reportExists && process.env.RENODE_JOB_RESULT === 'success' ? 'success' : 'failure',
                output: { title: reportExists ? 'Renode execution result' : 'Renode produced no test report', summary: message }
              });
            }
            if (context.eventName !== 'pull_request' || !writable) return;
            const marker = `<!-- renode-execution:${process.env.RENODE_ARTIFACT} -->`;
            const body = `${marker}\n### ${name}: execution\n${message}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
