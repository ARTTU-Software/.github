name: Copy App Secrets

on:
  workflow_dispatch:

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set secrets on documentation repository
        env:
          APP_ID: ${{ secrets.SYNC_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          printf '%s' "$APP_ID" | gh secret set SYNC_APP_ID --repo ARTTU-Software/documentation
          printf '%s' "$PRIVATE_KEY" | gh secret set SYNC_APP_PRIVATE_KEY --repo ARTTU-Software/documentation
          echo "Secrets set successfully"
