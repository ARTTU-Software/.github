name: Central Ceedling Unit Tests
on: 
  workflow_call:
    inputs:
      coverage:
        description: 'Run gcov coverage; set false explicitly for projects without the gcov plugin.'
        required: false
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          #token: ${{ secrets.ORG_PAT }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir gcovr
          if [ ! -f Gemfile ]; then
            gem install ceedling
          fi

      - name: Run Unit Tests & Coverage
        if: inputs.coverage
        run: |
          mkdir -p test/support
          if [ -f Gemfile ]; then
            bundle exec ceedling gcov:all
          else
            ceedling gcov:all
          fi

      - name: Run Unit Tests Without Coverage
        if: ${{ !inputs.coverage }}
        run: |
          if [ -f Gemfile ]; then
            bundle exec ceedling test:all
          else
            ceedling test:all
          fi

      # Discover Ceedling's artifact layout rather than assuming :build_root: build.
      # Match only the mode executed above, so a test report cannot replace gcov results.
      - name: Collect Ceedling Reports
        id: reports
        if: always()
        env:
          COVERAGE_ENABLED: ${{ inputs.coverage }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          coverage = os.environ['COVERAGE_ENABLED'] == 'true'
          mode = 'gcov' if coverage else 'test'
          directories = sorted(path for path in Path('.').glob(f'**/artifacts/{mode}') if path.is_dir())
          junit = [path / 'junit_tests_report.xml' for path in directories
                   if (path / 'junit_tests_report.xml').is_file()]
          summaries = [path / 'gcovr/coverage.txt' for path in directories
                       if coverage and (path / 'gcovr/coverage.txt').is_file()]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, paths in [('junit_files', junit), ('artifact_paths', directories)]:
                  output.write(f'{name}<<CEEDLING_PATHS\n')
                  output.writelines(f'{path.as_posix()}\n' for path in paths)
                  output.write('CEEDLING_PATHS\n')
              if summaries:
                  text = '\n\n'.join(f'### {path.as_posix()}\n\n```text\n{path.read_text(encoding="utf-8").rstrip()}\n```'
                                     for path in summaries)
                  report = Path(os.environ['RUNNER_TEMP']) / 'ceedling-coverage.md'
                  report.write_text(text, encoding='utf-8')
                  output.write(f'coverage_file={report.as_posix()}\n')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write(f'### 📊 Code Coverage Summary\n\n{text}\n')
          for path in junit + summaries:
              print(f'Found report: {path.as_posix()}')
          missing = []
          if not junit:
              missing.append(f'JUnit report (**/artifacts/{mode}/junit_tests_report.xml)')
          if coverage and not summaries:
              missing.append('coverage summary (**/artifacts/gcov/gcovr/coverage.txt)')
          for report in missing:
              print(f'::error::Missing Ceedling {report}. Check project.yml report plugins and formats.')
          if missing:
              raise SystemExit(1)
          PY

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: always() && steps.reports.outputs.junit_files != ''
        with:
          files: ${{ steps.reports.outputs.junit_files }}
          action_fail: true
          action_fail_on_inconclusive: true

      - name: Upload Ceedling Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.reports.outputs.artifact_paths != ''
        with:
          name: ceedling-reports
          path: ${{ steps.reports.outputs.artifact_paths }}
          if-no-files-found: error

      - name: Comment Coverage on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: always() && github.event_name == 'pull_request' && steps.reports.outputs.coverage_file != ''
        continue-on-error: true
        env:
          COVERAGE_FILE: ${{ steps.reports.outputs.coverage_file }}
        with:
          script: |
            const fs = require('fs');
            const coverageFile = process.env.COVERAGE_FILE;
            const coverageContent = fs.readFileSync(coverageFile, 'utf8');
            const header = '### 📊 Code Coverage Summary';
            const body = `${header}\n\n${coverageContent}`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body && c.body.includes(header));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
