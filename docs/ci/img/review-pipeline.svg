<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">From proposed firmware change to reviewable evidence and release</title>
  <desc id="desc">A pull request starts host unit tests, an ARM firmware build followed by static analysis, and adopted Renode simulation. Reviewers inspect reports and artifacts. A separate version tag starts the release and documentation chain.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#96a4bd" stroke-width="1.4"/></marker></defs>
  <rect width="1040" height="430" rx="22" fill="#111c2d"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="40" fill="#a9bad0" font-size="14" letter-spacing="2">CHECKING A PROPOSED SOFTWARE CHANGE</text>
    <g fill="none" stroke="#96a4bd" stroke-width="2" marker-end="url(#arrow)">
      <path d="M184 191H216V104H254"/><path d="M184 191H254"/><path d="M216 191V278H254"/>
      <path d="M485 104H780V178"/><path d="M485 191H529"/><path d="M746 191H767"/>
      <path d="M485 278H780V219"/>
    </g>
    <rect x="30" y="150" width="154" height="83" rx="12" fill="#273247" stroke="#53647e"/>
    <text x="107" y="184" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Pull request</text>
    <text x="107" y="211" text-anchor="middle" fill="#becbdd" font-size="15">proposed change</text>
    <rect x="254" y="67" width="231" height="74" rx="12" fill="#153d39" stroke="#4dcbb6"/>
    <text x="274" y="97" fill="#fff" font-size="20" font-weight="700">Host unit tests</text><text x="274" y="123" fill="#b8e6df" font-size="15">Ceedling · JUnit · coverage</text>
    <rect x="254" y="154" width="231" height="74" rx="12" fill="#213655" stroke="#7aa7ee"/>
    <text x="274" y="184" fill="#fff" font-size="20" font-weight="700">ARM firmware build</text><text x="274" y="210" fill="#c2d7f5" font-size="15">ELF · BIN · MAP · database</text>
    <rect x="529" y="154" width="217" height="74" rx="12" fill="#213655" stroke="#7aa7ee"/>
    <text x="549" y="184" fill="#fff" font-size="20" font-weight="700">Static analysis</text><text x="549" y="210" fill="#c2d7f5" font-size="15">Clang-Tidy uses build data</text>
    <rect x="254" y="241" width="231" height="74" rx="12" fill="#3a2e4d" stroke="#ba9bdf" stroke-dasharray="5 4"/>
    <text x="274" y="271" fill="#fff" font-size="20" font-weight="700">Renode simulation</text><text x="274" y="297" fill="#e0ceeF" font-size="15">where adopted · Robot reports</text>
    <rect x="767" y="150" width="243" height="83" rx="12" fill="#542c34" stroke="#ff8d99"/>
    <text x="787" y="184" fill="#fff" font-size="21" font-weight="700">Engineering review</text><text x="787" y="211" fill="#ffd1d6" font-size="15">reports + artifacts + source</text>
    <path d="M30 344H1010" stroke="#3b4b63"/>
    <text x="30" y="377" fill="#ffabb3" font-size="17" font-weight="700">SEPARATE RELEASE EVENT</text>
    <text x="340" y="377" fill="#e3eaf5" font-size="19">Version tag → build / release → documentation dispatch</text>
    <text x="30" y="408" fill="#a9bad0" font-size="14">Workflow definitions establish the process. Runner availability, adoption, and required merge checks are configured per repository.</text>
  </g>
</svg>
